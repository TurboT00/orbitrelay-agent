[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbitrelay-agent"
version = "0.6.0"
description = "A general-purpose personal assistant for configurable model endpoints"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "assistant", "personal-assistant", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "keyring>=25.7.0,<26",
    "openai>=2.45.0",
    "pathspec>=1.1.1",
]

[project.scripts]
orbitrelay = "orbitrelay.cli:main"

[project.urls]
Homepage = "https://github.com/TurboT00/orbitrelay-agent"
Repository = "https://github.com/TurboT00/orbitrelay-agent"
Issues = "https://github.com/TurboT00/orbitrelay-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/orbitrelay"]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "coverage>=7.6,<8",
    "mypy>=1.17,<3",
    "pip-audit>=2.7,<3",
    "ruff>=0.12,<1",
]


[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    ".bigpowers",
    "specs/archive",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is not a release-blocking style gate
]

[tool.ruff.lint.per-file-ignores]
# Nested with/subTest blocks are intentionally readable in tests.
"tests/**/*.py" = ["SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["orbitrelay"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["orbitrelay"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
pretty = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["orbitrelay"]
omit = [
    "*/orbitrelay/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
