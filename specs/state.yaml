decisions:
  product_identity: >-
    OrbitRelay is a general-purpose, text-first personal assistant. Coding and
    project work are supported use cases, not the product boundary.
  product_direction: >-
    Long-term direction may include Siri-like voice interaction, device actions,
    and personal-service integrations. These are not current capabilities.
  credential_store: Use the native OS credential store; never fall back to plaintext secrets.
  provider_connections: >-
    Resolve one selected catalog-backed connection per run. API keys enter only
    through a hidden prompt and are stored in the native credential store;
    environment variables and .env files are never credential sources.
  codex_boundary: >-
    Delegate Codex sign-in and execution to the official CLI. Never read, write,
    or store Codex credentials.
  provider_auth: >-
    Gemini OAuth is deferred pending its documented probe. Grok and DeepSeek are
    API-key-only until supported third-party subscription contracts exist.
  approval_boundary: >-
    Consequential tools fail closed unless confirmed or exactly pre-approved.
  session_boundary: >-
    Sessions are per-user local data with restrictive permissions, no app-level
    encryption, and keep-until-delete retention.
  workspace_read_privacy: >-
    Ordinary reads remain automatic. Sensitive paths fail closed under
    built-in rules, .gitignore, and deny-only .orbitrelayignore rules. Exact
    exceptions last one process; private keys and credential stores cannot be
    overridden. Sensitive turns are ephemeral unless separately persisted.
  workspace_privacy_catalog: >-
    Use the conservative path catalog in specs/IMPLEMENTATION_PLAN_LATEST.md.
    Git negation affects only Git-derived sensitivity. Exact-file and subtree
    exceptions make in-scope non-absolute-deny entries readable and discoverable
    for one process; absolute-deny entries remain omitted and unreadable.
  provider_status: >-
    Report structured offline facts and conservative local readiness. Use a
    separate explicit live verification command and retain only sanitized
    historical evidence.
  session_concurrency: >-
    One process owns a session for the complete run. Conflicts fail before a
    provider request unless a bounded wait is explicit. Persist only complete
    replay-safe groups with durable atomic replacement.
  python_support_target: >-
    Qualify Python 3.12 through 3.14 on macOS as a stabilization release gate.
    Linux is preview until qualified; Windows remains deferred. Keep current
    package metadata until the matrix passes.
  codex_disconnect: >-
    Provider disconnect removes OrbitRelay metadata only. Delegated logout is
    separate, with an explicit logout-first --disconnect combination. Never
    inspect Codex credentials or auto-select another provider.
  remote_push: Do not push without an explicit user request.
  stabilization_release_target: >-
    The standalone post-0.5.0 stabilization release is 0.6.0. Keep 1.0.0 reserved
    for a later product milestone. Package, module, CLI, and wheel identity report
    0.6.0; tagging and publication still require later release-owner approval.
preferences:
  - Ask before making product, auth, security, persistence, or platform-support assumptions.
  - Prefer verification over inference when intent is ambiguous.
  - Keep GitHub optional until cross-machine development makes CI valuable.
