initiative: conversations-and-streaming
roadmap_priority: P4
status: scoped
target_version: "0.5.0"
codename: Conversations and Streaming
predecessor: supported-hosted-access (P3, released as 0.4.0)

core_value: >-
  Make agent runs observable and resumable through one shared event model,
  token/tool-progress streaming, and local sessions the user can list and delete—
  without weakening approvals, workspace confinement, or secret-free logging.

summary: >-
  P4 lands the conversation and progress layer on top of the 0.4.0 hosted-access
  foundation. Before streaming or persistence, OrbitRelay defines one internal
  event model that can represent model output, tool requests, approval decisions,
  tool results, usage, errors, and run completion.

  On that model, P4 adds: (1) token and tool-progress streaming for live terminal
  observability; (2) local resumable sessions stored per-user under the OrbitRelay
  home (`~/.orbitrelay/sessions` or `$ORBITRELAY_HOME/sessions`), protected by
  restrictive filesystem permissions (0700/0600) without app-level encryption in
  this release; (3) explicit list/show/delete controls with keep-until-deleted
  retention (no auto-purge); (4) context-window budgeting that never splits a
  tool-call from its correlated result; and (5) structured run summaries suitable
  for terminal output and later telemetry.

  Session content is user data. Secrets (API keys, OAuth tokens) remain only in
  the OS keyring and must never be written into session files. P2 approval
  policies and sandbox confinement remain mandatory for OrbitRelay local tools.

locked_decisions:
  - id: ship_shape
    decision: >-
      0.5.0 ships full P4 in one release epic: event model, streaming, sessions,
      context budgeting, and run summaries. Stories may still be sequenced inside
      the epic.
  - id: event_model_first
    decision: >-\n      One shared event model is designed before streaming and session persistence
      features are layered on it.
  - id: session_storage_location
    decision: >-
      Durable sessions live under the per-user OrbitRelay home
      (`~/.orbitrelay/sessions` or `$ORBITRELAY_HOME/sessions`), not in the
      project repository.
  - id: session_protection
    decision: >-
      P4 uses filesystem permissions only (directory 0700, files 0600; reject
      group/world-writable or symlinked session stores). No app-level encryption
      of session payloads in P4; residual disk-access risk is documented.
  - id: session_retention
    decision: >-
      Keep sessions until the user deletes them. Provide list/show/delete (and
      delete-all if needed). No automatic expiry in P4.
  - id: secret_boundary
    decision: >-
      Session files must not store provider API keys, OAuth access/refresh tokens,
      or other CredentialStore secrets. Redaction applies to session serialization
      and streamed audit output.
  - id: approvals_invariant
    decision: >-
      Batch-first, fail-closed tool approvals and workspace confinement remain
      enforced for OrbitRelay local tools on every resumable/streamed run path.

in_scope:
  - id: e04s01
    outcome: >-
      Define and emit a single run event model covering model output, tool
      requests, approval decisions, tool results, usage, errors, and run
      completion, with offline tests for ordering and correlation.
  - id: e04s02
    outcome: >-
      Stream token/text deltas and tool-progress events to the terminal (or an
      injectable sink) without leaking secrets and without breaking non-stream
      runs.
  - id: e04s03
    outcome: >-
      Persist and resume local sessions under the per-user sessions directory with
      0700/0600 permissions, secret-free serialization, and stable session IDs.
  - id: e04s04
    outcome: >-
      Let users list, inspect (secret-free), and delete sessions, including
      delete-all, with keep-until-deleted retention defaults.
  - id: e04s05
    outcome: >-
      Budget context so complete tool-call/result pairs are preserved when history
      is truncated for model requests.
  - id: e04s06
    outcome: >-
      Produce structured run summaries (status, usage, tool counts, errors) for
      terminal output and future telemetry hooks.
  - id: e04s07
    outcome: >-
      Document streaming/session UX and security posture; verify offline via
      `./scripts/check.sh` with fake clocks/filesystems and no live providers.

out_of_scope:
  - item: App-level encryption of session payloads or keychain-wrapped session keys
    reason: Explicitly deferred; P4 uses filesystem permission isolation only.
  - item: Automatic session expiry / TTL purge
    reason: Retention is keep-until-deleted in P4.
  - item: Workspace-local or in-repo session storage by default
    reason: Sessions stay per-user under OrbitRelay home to avoid accidental commits.
  - item: Cloud sync, multi-device session sharing, or remote session servers
    reason: Out of local-agent scope; no authenticated control plane exists.
  - item: GUI/web conversation UIs
    reason: Terminal-first product; remote UIs deferred.
  - item: Changing Codex exec into a streamed Chat Completions peer
    reason: Codex remains an alternate process boundary; P4 focuses on OrbitRelay loop observability/persistence.
  - item: Provider credential persistence inside session files
    reason: Forbidden; credentials stay in OS keyring / profile metadata only.
  - item: Ollama/vLLM certification (P5), plugins (P6), Windows certification (P7)
    reason: Later roadmap items.
  - item: External telemetry backends / analytics pipelines
    reason: P4 only requires structured summaries suitable for later telemetry.

constraints:
  product:
    - Event model is the single source of truth for both streaming and persistence.
    - Non-stream mode remains supported and default-safe for scripts/pipes.
    - Resume must restore enough history for correct tool-call correlation.
    - Delete is permanent and user-initiated.
  security:
    - Session store rejects symlinks and group/world-writable paths (same spirit as profiles).
    - Never serialize CredentialStore secrets into sessions.
    - Streamed events and summaries remain secret-free under the same redaction rules as approvals.
    - Fail closed if session files are corrupt, truncated mid-event, or permission-unsafe.
  technical:
    - Preserve installable `orbitrelay` and `python -m orbitrelay` entry points.
    - Preserve existing approval, profile, SuperGrok, and Codex bridges.
    - Offline tests with temp ORBITRELAY_HOME, fake clocks, and fake model streams.
    - Python 3.14 minimum; macOS/Linux verified developer platforms.
  delivery:
    - Outcomes only in this scope; exact event schema fields, CLI flags, and file formats are plan-work.
    - No implementation until e04 stories are sliced and the session threat model is reviewed.

success_criteria:
  - A run emits ordered events for model output, tools, approvals, results, usage, errors, and completion.
  - Streaming mode shows progressive output/tool progress without secret leakage; non-stream mode still works.
  - Sessions persist under the per-user sessions directory with 0700/0600 permissions and can be resumed.
  - Users can list/show/delete sessions; deleted sessions are gone; no auto-purge occurs.
  - Context budgeting never sends a tool call without its correlated result (or drops the pair together).
  - Run summaries report outcome/usage/tool counts without credentials or raw secret-bearing payloads.
  - Existing P1–P3 profile/auth/approval/codex tests remain green.
  - ./scripts/check.sh passes after implementation.

